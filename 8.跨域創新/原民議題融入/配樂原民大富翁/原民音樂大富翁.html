<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣原住民文化大富翁</title>
    <style>
        :root {
            --board-size: 650px;
            --forest-dark: #1b3a1b;
            --earth-brown: #5c3a21;
            --tribal-red: #c0392b;
        }
        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            /* 原住民風格菱形圖騰 (祖靈之眼/百步蛇紋) 幾何背景 */
            background-color: #2b1a10;
            background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill-opacity='0.25'%3E%3Cpath d='M40 0L80 40L40 80L0 40Z' fill='%23c0392b'/%3E%3Cpath d='M40 15L65 40L40 65L15 40Z' fill='%23fdf6e3'/%3E%3Cpath d='M40 25L55 40L40 55L25 40Z' fill='%23000000'/%3E%3C/g%3E%3C/svg%3E");
            background-attachment: fixed;
            
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; margin: 0; color: #fdf6e3;
            overflow-x: hidden;
            padding-bottom: 40px;
        }
        .header { text-align: center; margin: 20px 0; }
        .header h1 {
            margin: 5px 0; 
            font-size: 36px;
            color: #f1c40f;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8), 0 0 15px var(--tribal-red);
            letter-spacing: 2px;
        }
        .main-game { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
        
        /* 側邊設定與計分板 */
        .side-panel { display: flex; flex-direction: column; gap: 20px; width: 280px; }
        .settings, .score-board {
            background: rgba(40, 25, 15, 0.85); 
            padding: 20px; border-radius: 12px;
            border: 3px solid #d35400;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
        }
        .settings h3, .score-board h3 {
            color: #f39c12; border-bottom: 2px dashed #e67e22; 
            padding-bottom: 10px; margin-top: 0;
        }
        .settings-btns { display: flex; gap: 10px; margin-top: 15px; }
        .btn-small { 
            padding: 10px 12px; font-size: 15px; cursor: pointer; border: none; border-radius: 6px;
            background: #e67e22; color: white; font-weight: bold; flex: 1;
            transition: 0.2s;
        }
        .btn-small:hover { background: #d35400; }
        .btn-small:disabled { background: #7f8c8d; color: #bdc3c7; cursor: not-allowed; }
        
        .score-item { 
            font-size: 18px; font-weight: bold; margin: 12px 0; 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 10px; background: rgba(255,255,255,0.1); 
            border-radius: 8px; border-left: 5px solid transparent;
        }
        .lap-badge {
            font-size: 12px; background: #c0392b; color: white; 
            padding: 2px 6px; border-radius: 10px; margin-left: 5px;
        }
        
        /* 遊戲區域 */
        .game-container {
            position: relative; width: var(--board-size); height: var(--board-size);
            background: rgba(0,0,0,0.5); border-radius: 15px;
            display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr);
            gap: 6px; padding: 10px; border: 4px solid var(--earth-brown);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(3px);
        }
        .cell {
            background: #fdf6e3; border-radius: 10px; color: #2c3e50;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 900; text-align: center; position: relative;
            box-shadow: 0 4px 0 #bdc3c7; transition: transform 0.1s;
        }
        .cell:active { transform: translateY(2px); box-shadow: 0 2px 0 #bdc3c7; }
        
        /* 格子主題顏色 */
        .cell.chance { background: #f8c291; border: 3px solid #e55039; color: #b71540; } /* 命運/機會 */
        .cell.task { background: #b8e994; border: 3px solid #78e08f; color: #079992; }   /* 知識/挑戰 */
        .cell.corner { background: #fad390; border: 3px solid #f6b93b; color: #e58e26; } /* 角落/休息 */
        .cell.start { background: #ffeaa7; border: 3px solid #fdcb6e; color: #d63031; }  /* 起點 */
        
        /* 玩家棋子 */
        .player-token {
            width: 36px; height: 36px; border-radius: 50%; position: absolute;
            z-index: 100; transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 3px solid #fff; display: flex; align-items: center; justify-content: center; 
            font-size: 20px; box-shadow: 0 5px 10px rgba(0,0,0,0.5);
            color: #ffffff; /* 圖騰內部顏色統一為白 */
        }

        .controls { margin-top: 25px; display: flex; align-items: center; gap: 20px; background: rgba(0,0,0,0.6); padding: 15px 30px; border-radius: 30px; backdrop-filter: blur(5px);}
        button.action-btn {
            padding: 15px 40px; font-size: 20px; cursor: pointer;
            background: #c0392b; color: white; border: none; border-radius: 30px; 
            font-weight: bold; box-shadow: 0 5px 0 #922b21; transition: 0.1s;
            letter-spacing: 1px;
        }
        button.action-btn:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 0 0 #922b21; }
        button.action-btn:disabled { background: #7f8c8d; box-shadow: 0 5px 0 #555; cursor: not-allowed; }
        
        /* 彈窗 */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 1000; backdrop-filter: blur(8px); }
        #msg-box {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #fdf6e3; padding: 30px; border-radius: 20px; color: #2c3e50;
            text-align: center; display: none; z-index: 1001; min-width: 350px; max-width: 85vw;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); border: 5px solid var(--tribal-red);
            background-image: url('data:image/svg+xml;utf8,<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><path d="M20 0L40 20L20 40L0 20Z" fill="rgba(192,57,43,0.05)"/></svg>');
        }
        #msg-title { margin-top: 0; font-size: 28px; color: var(--tribal-red); border-bottom: 2px solid #ccc; padding-bottom: 10px; }
        .msg-type-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; color: white; font-size: 14px; margin-bottom: 10px; }
        #msg-content { margin: 25px 0; font-size: 20px; line-height: 1.6; font-weight: bold; }
        .btn-group { display: flex; gap: 15px; justify-content: center; margin-top: 25px; flex-wrap: wrap;}
        .btn-group button { 
            padding: 12px 25px; font-size: 18px; border: none; border-radius: 12px;
            cursor: pointer; font-weight: bold; color: white; transition: 0.2s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }
        .btn-group button:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 rgba(0,0,0,0.2); }
        .btn-group button:disabled { cursor: not-allowed; opacity: 0.8; }

        /* 自訂題目表單控制項 */
        .form-control {
            width: 100%; box-sizing: border-box; padding: 10px; margin-top: 5px; 
            border-radius: 6px; font-size: 16px; border: 1px solid #ccc; font-family: inherit;
        }

        /* 背景音樂按鈕群組 */
        .bgm-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 10px;
        }
        .bgm-btn {
            background: rgba(192, 57, 43, 0.8);
            color: white;
            border: 2px solid #f1c40f;
            border-radius: 30px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }
        .bgm-btn:hover { background: rgba(231, 76, 60, 1); transform: scale(1.05); }
        .bgm-btn.playing { background: rgba(39, 174, 96, 0.9); }
        
        .bgm-upload-btn {
            background: rgba(41, 128, 185, 0.8);
            border-color: #3498db;
        }
        .bgm-upload-btn:hover { background: rgba(52, 152, 219, 1); }

        @media (max-width: 768px) {
            :root { --board-size: 95vw; }
            .main-game { flex-direction: column; align-items: center; }
            .side-panel { width: 95vw; flex-direction: row; flex-wrap: wrap; }
            .settings, .score-board { flex: 1; min-width: 250px; }
            .bgm-container { top: 10px; right: 10px; flex-direction: column; gap: 5px; }
            .bgm-btn { padding: 8px 15px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- 背景音樂元件 (預設線上授權音樂，避免 Canvas 中因找不到本機檔案而報錯) -->
    <!-- 下載後您可以將 src 替換為 src="免費配樂.mp3" -->
    <audio id="bgm" src="https://upload.wikimedia.org/wikipedia/commons/4/4b/Drums_of_the_Buru_tribe.ogg" loop preload="auto"></audio>
    
    <div class="bgm-container">
        <button id="bgm-toggle" class="bgm-btn" onclick="toggleBGM()">🎵 播放音樂</button>
        <!-- 讓使用者在預覽環境也能手動選取本機音樂的按鈕 -->
        <button class="bgm-btn bgm-upload-btn" onclick="document.getElementById('bgm-upload').click()">📂 載入本機配樂</button>
        <input type="file" id="bgm-upload" accept="audio/*" style="display: none;" onchange="loadCustomBGM(event)">
    </div>

    <div class="header">
        <h1>🌲 台灣原住民文化大富翁 🦅</h1>
        <div id="turn-info" style="font-weight:bold; font-size:24px; margin-top:15px; padding: 8px 30px; background: rgba(0,0,0,0.6); border-radius: 30px; display: inline-block; border: 2px solid #f1c40f; backdrop-filter: blur(4px);">
            準備出發！
        </div>
    </div>

    <div class="main-game">
        <div class="game-container" id="board">
            <!-- 棋子與格子會由 JS 動態生成 -->
        </div>
        
        <div class="side-panel">
            <div class="settings">
                <h3>👥 部落隊伍設定 (上限8隊)</h3>
                <div class="settings-btns">
                    <button class="btn-small" id="add-team-btn" onclick="addPlayer()">+ 招募部落</button>
                    <button class="btn-small" id="rm-team-btn" onclick="removePlayer()">- 減少部落</button>
                </div>
            </div>

            <!-- 新增題庫管理區塊 -->
            <div class="settings">
                <h3>📚 題庫管理</h3>
                <div class="settings-btns">
                    <button class="btn-small" style="background:#27ae60;" onclick="openAddQModal()">➕ 新增自訂題目</button>
                </div>
                <div id="custom-q-status" style="margin-top:10px; font-size:15px; font-weight:bold; color:#f1c40f; text-align:center;">
                    排隊待出題: 0 題
                </div>
            </div>

            <div class="score-board">
                <h3>🏆 榮譽積分榜</h3>
                <div id="score-container">
                    <!-- 分數表由 JS 動態生成 -->
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div id="dice-val" style="font-size: 28px; background: white; color: #c0392b; padding: 12px 25px; border-radius: 20px; font-weight: 900; border: 3px solid #c0392b;">🎲 等待指令</div>
        <button class="action-btn" id="roll-btn" onclick="rollDice()">投擲骰子</button>
    </div>

    <!-- 地圖事件與題目視窗 -->
    <div class="overlay" id="overlay"></div>
    <div id="msg-box">
        <h2 id="msg-title">標題</h2>
        <div id="msg-badge" class="msg-type-badge">標籤</div>
        <div id="msg-content">內容</div>
        <div id="msg-footer" class="btn-group"></div>
    </div>

    <!-- 手動新增題目視窗 -->
    <div class="overlay" id="add-q-overlay" style="z-index: 2000;"></div>
    <div id="add-q-modal" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fdf6e3; padding: 30px; border-radius: 20px; color: #2c3e50; z-index: 2001; min-width: 350px; width: 90vw; max-width: 500px; display: none; border: 5px solid #27ae60; box-shadow: 0 15px 40px rgba(0,0,0,0.6);">
        <h2 style="color: #27ae60; margin-top: 0; border-bottom: 2px solid #ccc; padding-bottom: 10px;">➕ 新增自訂題目</h2>

        <div style="margin-bottom: 15px; text-align: left;">
            <label style="font-weight: bold; color: #e67e22;">題目類型</label><br>
            <select id="new-q-type" class="form-control" style="background: #fff3e0;">
                <option value="task">📝 文化知識 / 互動挑戰 (優先攔截出題)</option>
                <option value="chance">🌀 機會 / 命運 (加入命運抽卡堆中)</option>
            </select>
        </div>

        <div style="margin-bottom: 15px; text-align: left;">
            <label style="font-weight: bold;">題目名稱</label><br>
            <input type="text" id="new-q-title" class="form-control" placeholder="例：部落美食考驗">
        </div>

        <div style="margin-bottom: 15px; text-align: left;">
            <label style="font-weight: bold;">題目內容</label><br>
            <textarea id="new-q-desc" class="form-control" rows="3" placeholder="請描述問題內容或動作指令... (必填)" style="resize: vertical;"></textarea>
        </div>

        <div style="margin-bottom: 15px; text-align: left;">
            <label style="font-weight: bold;">解答 / 主持提示</label><br>
            <textarea id="new-q-ans" class="form-control" rows="2" placeholder="(選填) 提供給主持人的答案或判定標準..." style="resize: vertical;"></textarea>
        </div>

        <div style="margin-bottom: 20px; text-align: left;">
            <label style="font-weight: bold;">成功加分 (答對/挑戰成功獲得分數)</label><br>
            <input type="number" id="new-q-score" class="form-control" value="20" style="width: 100px;"> 分
        </div>

        <div class="btn-group">
            <button onclick="saveNewQuestion()" style="background: #27ae60;">確認新增</button>
            <button onclick="closeAddQModal()" style="background: #7f8c8d;">取消</button>
        </div>
    </div>

    <script>
        // 原住民文化主題任務庫 (共20格)
        const cellsData = [
            {name:"部落廣場", type:"start", icon:"🛖", badge:"起點", bg:"#f39c12", desc:"【起點】回到部落聚會所！經過或停留此處，可獲得祖靈的祝福，加 20 分！"}, 
            
            {name:"豐年祭舞", type:"task", icon:"💃", badge:"互動挑戰", bg:"#2ecc71", desc:"【舞蹈題】全隊一起手牽手，模仿一段原住民傳統的交叉步伐舞蹈動作，邊跳邊歡呼，持續 10 秒！\n(主持人判定是否夠熱情)"}, 
            
            {name:"命運交響", type:"chance", icon:"🌀", badge:"機會命運", bg:"#e74c3c", desc:"森林裡的風帶來了未知的訊息... 抽一張機會命運卡吧！"},
            
            {name:"圖騰之謎", type:"task", icon:"🗿", badge:"文化知識", bg:"#3498db", desc:"【知識題】泰雅族和賽德克族傳統中，成年且具備特定技能(如織布或狩獵)的男女，會在臉上進行什麼傳統印記？\n(答：紋面)"}, 
            
            {name:"神射手", type:"task", icon:"🏹", badge:"互動挑戰", bg:"#2ecc71", desc:"【動作題】狩獵是傳統重要的生存技能。請全隊同時模仿獵人「拉弓、瞄準、射出」的動作，並配上「咻——」的音效！\n(主持人評判動作整齊度)"}, 
            
            {name:"石板屋", type:"corner", icon:"🏠", badge:"安全區", bg:"#f1c40f", desc:"進入排灣族與魯凱族傳統的「石板屋」休息。冬暖夏涼，非常舒服，安全過關！"},
            
            {name:"海洋恩賜", type:"task", icon:"🐟", badge:"文化知識", bg:"#3498db", desc:"【知識題】蘭嶼的達悟族在每年春夏季會舉辦什麼重要的祭典，以祈求豐收並表達對海洋的敬畏？\n(答：飛魚祭)"}, 
            
            {name:"祖靈保佑", type:"chance", icon:"✨", badge:"機會命運", bg:"#e74c3c", desc:"祭司正在進行儀式... 抽一張機會命運卡吧！"}, 
            
            {name:"語言傳承", type:"task", icon:"🗣️", badge:"文化知識", bg:"#3498db", desc:"【知識題】請說出一句你知道的「台灣原住民族語言」問候語！\n(答：如 阿美族 Nga'ay ho / 泰雅族 Lokah su 等，由主持人認定)"},
            
            {name:"勇士出征", type:"task", icon:"🔥", badge:"終極挑戰", bg:"#9b59b6", desc:"【勇氣題】模擬早期勇士出征或狩獵前的儀式：想一個威武的「勇士呼喊口號」，搭配氣勢磅礡的動作大聲喊出！\n(視氣勢由主持人給分)"}, 
            
            {name:"高空瞭望", type:"corner", icon:"👀", badge:"安全區", bg:"#f1c40f", desc:"爬上部落的木造瞭望台守衛，視野極佳，提早發現了遠方的動靜。安全過關！"}, 
            
            {name:"傳說神獸", type:"task", icon:"🦌", badge:"文化知識", bg:"#3498db", desc:"【知識題】相傳「邵族」的祖先，是為了一路追逐一隻什麼顏色的動物，才發現了美麗的日月潭？\n(答：白鹿)"},
            
            {name:"山林奇遇", type:"chance", icon:"🐾", badge:"機會命運", bg:"#e74c3c", desc:"在打獵的途中發現了未知的足跡... 抽一張機會命運卡吧！"}, 
            
            {name:"搗麻糬", type:"task", icon:"🍚", badge:"互動挑戰", bg:"#2ecc71", desc:"【動作題】兩人一組！一人假裝拿木杵用力往下「搗」，另一人假裝在臼裡「翻動」麻糬，配合節奏喊「嘿！咻！」持續 10 秒！\n(主持人判定節奏感)"}, 
            
            {name:"百步蛇紋", type:"task", icon:"🐍", badge:"文化知識", bg:"#3498db", desc:"【知識題】在台灣原住民族中，哪一個族群常將「百步蛇」視為貴族專屬的圖騰與祖靈象徵？\n(答：排灣族 或 魯凱族)"},
            
            {name:"迷霧森林", type:"corner", icon:"🌲", badge:"安全區", bg:"#f1c40f", desc:"迷失在祖靈守護的茂密森林中，不過風景優美，吸收滿滿芬多精。暫停休息一次！"}, 
            
            {name:"天籟之音", type:"task", icon:"🎵", badge:"互動挑戰", bg:"#2ecc71", desc:"【音樂題】布農族有著名的「祈禱小米豐收歌」(八部合音)。請全隊圍成一圈，一起發出低沉且漸漸變大聲的「喔～」和聲，維持 5 秒！\n(主持人判定和諧度)"}, 
            
            {name:"祭典時刻", type:"chance", icon:"🎉", badge:"機會命運", bg:"#e74c3c", desc:"一年一度的盛大祭典開始了... 抽一張機會命運卡吧！"},
            
            {name:"傳統建築", type:"task", icon:"⛏️", badge:"文化知識", bg:"#3498db", desc:"【知識題】蘭嶼達悟族的傳統建築，為了防範強烈的颱風與東北季風，房屋主體會建在地面以下，這種建築稱為什麼？\n(答：半穴居/地下屋)"}, 
            
            {name:"感恩天地", type:"task", icon:"☀️", badge:"終極挑戰", bg:"#9b59b6", desc:"【感心題】原住民族非常敬畏大自然。請全隊雙手交叉放在胸前，閉上眼睛向天空大喊：「感謝祖靈與大自然的賜予！」\n(誠心誠意由主持人給分)"}
        ];

        // --- 繪製台灣原住民專屬 SVG 圖騰 ---
        const svgAmis   = `<svg viewBox="0 0 100 100" width="1em" height="1em" fill="currentColor"><path d="M50 0L60 30L95 15L70 40L100 50L70 60L95 85L60 70L50 100L40 70L5 85L30 60L0 50L30 40L5 15L40 30ZM50 70A20 20 0 1 0 50 30A20 20 0 1 0 50 70Z" fill-rule="evenodd"/></svg>`; // 阿美族 (太陽紋)
        const svgAtayal = `<svg viewBox="0 0 100 100" width="1em" height="1em" fill="currentColor"><path d="M50 10L90 50L50 90L10 50ZM50 35L65 50L50 65L35 50ZM46 50A4 4 0 1 0 54 50A4 4 0 1 0 46 50Z" fill-rule="evenodd"/></svg>`; // 泰雅族 (菱形祖靈之眼)
        const svgPaiwan = `<svg viewBox="0 0 100 100" width="1em" height="1em" fill="currentColor"><path d="M50 5L95 50L50 95L5 50ZM50 25L75 50L50 75L25 50Z" fill-rule="evenodd"/><circle cx="50" cy="50" r="8"/><circle cx="20" cy="50" r="6"/><circle cx="80" cy="50" r="6"/><circle cx="50" cy="20" r="6"/><circle cx="50" cy="80" r="6"/></svg>`; // 排灣族 (百步蛇菱紋)
        const svgBunun  = `<svg viewBox="0 0 100 100" width="1em" height="1em" fill="currentColor"><path d="M10 90L50 10L90 90ZM35 80L50 50L65 80Z" fill-rule="evenodd"/><polygon points="50,25 45,35 55,35"/></svg>`; // 布農族 (畫曆/高山三角)
        const svgTao    = `<svg viewBox="0 0 100 100" width="1em" height="1em" fill="currentColor"><path d="M50 10A40 40 0 1 0 50 90A40 40 0 1 0 50 10ZM50 20A30 30 0 1 1 50 80A30 30 0 1 1 50 20ZM50 35A15 15 0 1 0 50 65A15 15 0 1 0 50 35ZM45 50A5 5 0 1 0 55 50A5 5 0 1 0 45 50Z" fill-rule="evenodd"/></svg>`; // 達悟族 (同心圓船眼紋)
        const svgRukai  = `<svg viewBox="0 0 100 100" width="1em" height="1em" fill="currentColor"><path d="M50 10 C 20 40, 40 60, 50 90 C 60 60, 80 40, 50 10 Z"/><path d="M10 50 C 30 40, 40 50, 50 70 C 40 80, 20 70, 10 50 Z"/><path d="M90 50 C 70 40, 60 50, 50 70 C 60 80, 80 70, 90 50 Z"/></svg>`; // 魯凱族 (百合花圖騰)
        const svgPuyuma = `<svg viewBox="0 0 100 100" width="1em" height="1em" fill="currentColor"><path d="M20 10 h60 v50 a30 30 0 0 1 -60 0 z M30 20 h40 v10 h-40 z M30 45 h40 v10 h-40 z M45 70 h10 v10 h-10 z" fill-rule="evenodd"/></svg>`; // 卑南族 (傳統盾牌紋)
        const svgSeediq = `<svg viewBox="0 0 100 100" width="1em" height="1em" fill="currentColor"><path d="M10 10 h80 v20 h-80 z M10 70 h80 v20 h-80 z M40 0 h20 v100 h-20 z M40 30 h20 v40 h-20 z" fill-rule="evenodd"/></svg>`; // 賽德克族 (傳統織布紋)

        // 台灣原住民 8 大代表部落設定
        const allTeams = [
            {name: "阿美部落", icon: svgAmis, color: "#e74c3c"},
            {name: "泰雅部落", icon: svgAtayal, color: "#c0392b"},
            {name: "排灣部落", icon: svgPaiwan, color: "#27ae60"},
            {name: "布農部落", icon: svgBunun, color: "#f39c12"},
            {name: "達悟部落", icon: svgTao, color: "#2980b9"},
            {name: "魯凱部落", icon: svgRukai, color: "#8e44ad"},
            {name: "卑南部落", icon: svgPuyuma, color: "#16a085"},
            {name: "賽德克部落", icon: svgSeediq, color: "#7f8c8d"}
        ];

        // 機會/命運抽卡堆 (拉到全域變數方便新增)
        let chanceEvents = [
            { text: "【模仿挑戰】全隊學『台灣黑熊』站立並做出霸氣威嚇動作！", ans: "主持人請評判氣勢是否足夠！", scoreSuccess: 20, scoreFail: 0 },
            { text: "【默契考驗】兩人一組，一人閉眼，另一人只能用『族語或原民風格口號』引導他走到主持人指定位置。", ans: "成功抵達即可獲得高分！", scoreSuccess: 20, scoreFail: -5 },
            { text: "【傳統舞蹈】請全隊手牽手，圍成一圈，並以『兩步進、一步退』的節奏歡呼跳舞一圈！", ans: "動作整齊劃一、氣氛夠熱烈即可加分！", scoreSuccess: 15, scoreFail: 0 },
            { text: "【勇士試煉】推派一名勇士，與『主持人』進行『單腳站立推手』比賽（或猜拳），贏了加分！", ans: "勇士是否擊敗了主持人？", scoreSuccess: 25, scoreFail: -10 },
            { text: "【禁忌考驗】這回合不能說出『你、我、他』三個字，請派代表對主持人說一段「感謝祖靈的話」。", ans: "若不小心說出禁忌字眼則失敗扣分！", scoreSuccess: 15, scoreFail: -5 }
        ];

        // 待出題佇列 (自訂的挑戰題將優先攔截原本的地圖題目)
        let customTaskQueue = [];

        // 背景音樂控制狀態
        let isPlayingBGM = false;

        // 6x6 繞圈矩陣對應的格子 ID (共20格)
        const mapping = [0,1,2,3,4,5,11,17,23,29,35,34,33,32,31,30,24,18,12,6];
        
        let players = [];
        let turn = 0;
        let countdownTimer = null; 

        // 初始化遊戲
        function init() {
            const board = document.getElementById('board');
            board.innerHTML = ""; 
            
            for(let i=0; i<36; i++) {
                let d = document.createElement('div'); 
                d.id = 'grid-'+i; 
                d.className = 'cell';
                d.style.visibility = 'hidden'; 
                board.appendChild(d);
            }
            
            mapping.forEach((idx, mIdx) => {
                let cell = document.getElementById('grid-'+idx);
                let data = cellsData[mIdx];
                cell.innerHTML = `<div style="font-size:28px; margin-bottom:5px;">${data.icon}</div><div style="line-height:1.2;">${data.name}</div>`;
                cell.className = 'cell ' + data.type;
                if(data.type === 'start') cell.classList.add('start');
                cell.style.visibility = 'visible';
            });

            // 預設給 2 隊
            addPlayer(true);
            addPlayer(true);
            
            updateTurnUI();
        }

        function renderPlayers() {
            const board = document.getElementById('board');
            const scoreContainer = document.getElementById('score-container');
            
            document.querySelectorAll('.player-token').forEach(e => e.remove());
            scoreContainer.innerHTML = "";

            players.forEach((p, idx) => {
                let token = document.createElement('div');
                token.id = 'player-' + idx;
                token.className = 'player-token';
                token.innerHTML = p.icon; // 使用圖騰 SVG
                token.style.background = p.color;
                
                if (idx === turn) {
                    token.style.boxShadow = `0 0 15px 5px ${p.color}, 0 5px 10px rgba(0,0,0,0.5)`;
                    token.style.transform = 'scale(1.2)';
                    token.style.zIndex = '200';
                }
                
                board.appendChild(token);

                let scoreItem = document.createElement('div');
                scoreItem.className = 'score-item';
                scoreItem.style.borderLeftColor = p.color;
                if (idx === turn) scoreItem.style.background = 'rgba(255,255,255,0.25)';
                
                scoreItem.innerHTML = `
                    <div style="display:flex; align-items:center;">
                        <span style="color:${p.color}; font-size:26px; margin-right:8px; display:flex;">${p.icon}</span> 
                        <span style="color:#fdf6e3;">${p.name}</span>
                        <span class="lap-badge">第 ${p.laps + 1} 圈</span>
                    </div> 
                    <div id="score-${idx}" style="font-size:26px; color:#f1c40f; text-shadow:1px 1px 2px #000;">${p.score}</div>
                `;
                scoreContainer.appendChild(scoreItem);
            });

            players.forEach((_, idx) => updatePos(idx));
            updateButtonsState();
        }

        // 新增隊伍 
        function addPlayer(isInit = false) {
            if (players.length >= 8) {
                alert("最多只能有 8 個部落參與喔！");
                return;
            }
            let newTeamData = allTeams[players.length];
            players.push({ pos: 0, score: 0, laps: 0, name: newTeamData.name, icon: newTeamData.icon, color: newTeamData.color });
            
            if (!isInit) {
                renderPlayers();
                if (turn >= players.length) turn = 0; 
                updateTurnUI();
            }
        }

        // 減少隊伍
        function removePlayer() {
            if (players.length <= 2) return; 
            players.pop();
            if (turn >= players.length) turn = 0; 
            
            renderPlayers();
            updateTurnUI();
        }

        function updateButtonsState() {
            document.getElementById('add-team-btn').disabled = (players.length >= 8);
            document.getElementById('rm-team-btn').disabled = (players.length <= 2);
        }

        // 擲骰子
        async function rollDice() {
            document.getElementById('roll-btn').disabled = true;
            let steps = Math.floor(Math.random()*6) + 1;
            document.getElementById('dice-val').innerText = "🎲 前進 " + steps + " 步";
            
            let p = players[turn];

            for(let i=0; i<steps; i++) {
                p.pos = (p.pos + 1) % mapping.length;
                if (p.pos === 0) {
                    p.laps++;
                    p.score += 20; 
                    document.getElementById('score-'+turn).innerText = p.score;
                }
                players.forEach((_, idx) => updatePos(idx));
                await new Promise(r => setTimeout(r, 300));
            }
            
            renderPlayers();
            setTimeout(() => { showMsg(); }, 200);
        }

        function updatePos(pIdx) {
            let p = players[pIdx];
            let gridIdx = mapping[p.pos];
            let cell = document.getElementById('grid-'+gridIdx);
            let token = document.getElementById('player-'+pIdx);
            
            if (!cell || !token) return;

            let sameCellPlayers = players.map((player, idx) => ({idx: idx, pos: player.pos})).filter(player => player.pos === p.pos);
            let myOrderInCell = sameCellPlayers.findIndex(player => player.idx === pIdx);
            let totalInCell = sameCellPlayers.length;

            let offsetX = 0; let offsetY = 0;
            if (totalInCell > 1) {
                const positions = [
                    {x: -12, y: -12}, {x: 12, y: 12}, 
                    {x: -12, y: 12}, {x: 12, y: -12},
                    {x: 0, y: -16}, {x: 0, y: 16},
                    {x: -16, y: 0}, {x: 16, y: 0}
                ];
                if (myOrderInCell < positions.length) {
                    offsetX = positions[myOrderInCell].x;
                    offsetY = positions[myOrderInCell].y;
                }
            }

            token.style.left = (cell.offsetLeft + cell.offsetWidth/2 - 18 + offsetX) + 'px';
            token.style.top = (cell.offsetTop + cell.offsetHeight/2 - 18 + offsetY) + 'px';
        }

        // ------------------ 手動新增題目相關邏輯 ------------------ //
        function openAddQModal() {
            document.getElementById('add-q-overlay').style.display = 'block';
            document.getElementById('add-q-modal').style.display = 'block';
        }

        function closeAddQModal() {
            document.getElementById('add-q-overlay').style.display = 'none';
            document.getElementById('add-q-modal').style.display = 'none';
            // 清空表單
            document.getElementById('new-q-title').value = '';
            document.getElementById('new-q-desc').value = '';
            document.getElementById('new-q-ans').value = '';
            document.getElementById('new-q-score').value = '20';
        }

        function saveNewQuestion() {
            let type = document.getElementById('new-q-type').value;
            let title = document.getElementById('new-q-title').value.trim() || "自訂題目";
            let desc = document.getElementById('new-q-desc').value.trim();
            let ans = document.getElementById('new-q-ans').value.trim() || "請主持人自由判定標準！";
            let score = parseInt(document.getElementById('new-q-score').value) || 20;

            if(!desc) {
                alert("❗ 請務必填寫「題目內容」！");
                return;
            }

            if(type === 'task') {
                customTaskQueue.push({ title: title, desc: desc, ans: ans, score: score });
                document.getElementById('custom-q-status').innerText = `排隊待出題: ${customTaskQueue.length} 題`;
            } else {
                chanceEvents.push({
                    text: `【${title}】${desc}`,
                    ans: ans,
                    scoreSuccess: score,
                    scoreFail: 0
                });
                alert("✅ 已成功加入機會命運的抽卡堆中！");
            }
            closeAddQModal();
        }


        // 建立 5 秒倒數與主持按鈕
        function startHostCountdown(finalButtonsHTML) {
            if (countdownTimer) clearInterval(countdownTimer);
            
            let footer = document.getElementById('msg-footer');
            footer.innerHTML = `<button id="host-btn" disabled style="background:#7f8c8d; cursor:not-allowed;">思考與動作時間... 5 秒</button>`;
            
            let counter = 5;
            countdownTimer = setInterval(() => {
                counter--;
                let btn = document.getElementById('host-btn');
                if (btn) {
                    if (counter > 0) {
                        btn.innerText = `思考與動作時間... ${counter} 秒`;
                    } else {
                        clearInterval(countdownTimer);
                        btn.disabled = false;
                        btn.style.cursor = "pointer";
                        btn.style.background = "#e67e22";
                        btn.innerText = "⭐ 主持人揭曉解答 / 評判分數 ⭐";
                        btn.onclick = () => {
                            // 替換成評分或解答按鈕
                            footer.innerHTML = finalButtonsHTML;
                            // 顯示隱藏的解答(如果有)
                            let ansEl = document.getElementById('hidden-answer');
                            if (ansEl) ansEl.style.display = 'block';
                        };
                    }
                } else {
                    clearInterval(countdownTimer);
                }
            }, 1000);
        }

        // 顯示格子任務彈窗
        function showMsg() {
            let data = cellsData[players[turn].pos];
            
            let badge = document.getElementById('msg-badge');
            let footer = document.getElementById('msg-footer');
            
            // 設定標題與標籤預設值
            document.getElementById('msg-title').innerText = data.icon + " " + data.name;
            badge.innerText = data.badge;
            badge.style.background = data.bg;
            
            if(data.type === 'task') {
                let question, answer;
                let successPts = 15; // 預設加分

                // --- 檢查是否有自訂題目排隊攔截 ---
                if (customTaskQueue.length > 0) {
                    let customQ = customTaskQueue.shift(); // 抽出第一題
                    document.getElementById('custom-q-status').innerText = `排隊待出題: ${customTaskQueue.length} 題`;
                    
                    document.getElementById('msg-title').innerText = "⭐ " + customQ.title;
                    badge.innerText = "自訂挑戰 (優先出題)";
                    badge.style.background = "#e67e22";
                    
                    question = customQ.desc;
                    answer = customQ.ans;
                    successPts = customQ.score;
                } else {
                    // 若無自訂題，顯示地圖預設題目
                    let parts = data.desc.split('\n');
                    question = parts[0];
                    answer = parts.length > 1 ? parts.slice(1).join('\n') : "";
                }

                document.getElementById('msg-content').innerHTML = `
                    <div style="font-size:22px;">${question}</div>
                    <div id="hidden-answer" style="display:none; color:#c0392b; margin-top:20px; border-top:2px dashed #ccc; padding-top:15px;">(答/提示: ${answer})</div>
                `;
                
                // 設定 5 秒後主持人可控按鈕 (帶入動態分數)
                let finalBtns = `
                    <button onclick="addScore(${successPts})" style="background:#27ae60;">成功/答對 (+${successPts}分)</button> 
                    <button onclick="addScore(0)" style="background:#c0392b;">失敗/答錯 (+0分)</button>
                `;
                startHostCountdown(finalBtns);
                
            } else {
                // 安全區、起點、命運
                document.getElementById('msg-content').innerText = data.desc;
                
                if(data.type === 'chance') {
                    footer.innerHTML = `<button onclick="drawChance()" style="background:#8e44ad;">翻開命運卡</button>`;
                } else if(data.type === 'start') {
                    footer.innerHTML = `<button onclick="closeMsg()" style="background:#f39c12;">感謝祖靈祝福</button>`;
                } else {
                    footer.innerHTML = `<button onclick="closeMsg()" style="background:#2980b9;">繼續旅程</button>`;
                }
            }
            
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('msg-box').style.display = 'block';
        }

        // 抽卡系統 (含自訂題庫)
        function drawChance() {
            // 從全域抽卡堆中隨機抽一題
            let res = chanceEvents[Math.floor(Math.random() * chanceEvents.length)];
            
            document.getElementById('msg-content').innerHTML = `
                <div style="font-size:24px; color:#8e44ad;">${res.text}</div>
                <div id="hidden-answer" style="display:none; color:#d35400; margin-top:20px; border-top:2px dashed #ccc; padding-top:15px;">(主持提示：${res.ans})</div>
            `;
            
            let finalBtns = `
                <button onclick="addScore(${res.scoreSuccess})" style="background:#27ae60;">挑戰成功 (+${res.scoreSuccess}分)</button> 
                <button onclick="addScore(${res.scoreFail})" style="background:#c0392b;">挑戰失敗 (${res.scoreFail}分)</button>
            `;
            
            // 進入動作題，開始 5 秒倒數
            startHostCountdown(finalBtns);
        }

        // 加分並關閉
        function addScore(pts) {
            players[turn].score += pts;
            document.getElementById('score-'+turn).innerText = players[turn].score;
            closeMsg();
        }

        // 關閉視窗與換下一隊
        function closeMsg() {
            if (countdownTimer) clearInterval(countdownTimer);
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('msg-box').style.display = 'none';
            
            turn = (turn + 1) % players.length;
            renderPlayers(); 
            updateTurnUI();
            
            document.getElementById('roll-btn').disabled = false;
            document.getElementById('dice-val').innerText = "🎲 換下一隊";
        }

        // --- 本機音樂動態載入邏輯 ---
        function loadCustomBGM(event) {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                const bgm = document.getElementById('bgm');
                bgm.src = url;
                
                // 嘗試自動播放
                bgm.play().then(() => {
                    let btn = document.getElementById('bgm-toggle');
                    btn.innerText = '🔊 暫停音樂';
                    btn.classList.add('playing');
                    isPlayingBGM = true;
                }).catch(err => {
                    console.log("自動播放失敗: ", err);
                    alert("音樂已載入！請點擊「🎵 播放音樂」按鈕來開始播放。");
                });
            }
        }

        // 音樂切換邏輯
        function toggleBGM() {
            let bgm = document.getElementById('bgm');
            let btn = document.getElementById('bgm-toggle');
            
            // 檢查音樂來源是否有效或載入失敗
            if (!bgm.src || bgm.src.endsWith('免費配樂.mp3') || bgm.error) {
                alert("在此預覽環境下，無法直接讀取對話框上傳的檔案。\n\n請點擊旁邊的【📂 載入本機配樂】按鈕手動選取您的 MP3 檔案，或是下載此 HTML 檔案並在電腦中執行。");
                return;
            }

            if (isPlayingBGM) {
                bgm.pause();
                btn.innerText = '🎵 播放音樂';
                btn.classList.remove('playing');
            } else {
                bgm.play().then(() => {
                    btn.innerText = '🔊 暫停音樂';
                    btn.classList.add('playing');
                }).catch(err => {
                    console.log("播放失敗: ", err);
                    alert("瀏覽器可能阻擋了自動播放，請先在畫面上點擊一下再試試看！");
                });
            }
            isPlayingBGM = !isPlayingBGM;
        }

        function updateTurnUI() {
            let currentTeam = players[turn];
            let info = document.getElementById('turn-info');
            info.innerHTML = `輪到 <span style="color:${currentTeam.color}; font-size: 28px; display:inline-flex; align-items:center; vertical-align:middle;">${currentTeam.icon} <span style="margin-left:8px;">${currentTeam.name}</span></span> 擲骰！`;
        }

        init();
        setTimeout(() => { renderPlayers(); }, 150); 
        
        window.onresize = () => {
            players.forEach((_, idx) => updatePos(idx));
        };
    </script>
</body>
</html>
